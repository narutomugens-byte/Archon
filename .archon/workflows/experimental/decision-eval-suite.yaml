  # ─── 3. AGGREGATE (deterministic gate, no AI) ─────────────────────────
  # Shared script — dimension-agnostic. Median-of-3 per case per dimension,
  # queue-identity check, optional labels.json detection gate, thresholds,
  # baseline regression. Reads dims/weights/thresholds from suite.json.
  - id: aggregate
    depends_on: [score-1, score-2, score-3]
    script: eval-aggregate
    runtime: bun
    timeout: 30000

  # ─── 4. VERDICT (cheap readable synthesis) ────────────────────────────
  - id: verdict
    depends_on: [aggregate]
    model: small
    context: fresh
    allowed_tools: []
    timeout: 60000
    prompt: |
      The deterministic scorecard below already contains the AUTHORITATIVE gate
      decision for a set of ARCHITECTURAL DECISIONS / CONTRACTS. Restate it for a
      human — do NOT recompute or override it. If the gate is FAIL, lead with the
      concrete blocking reasons (dimension-floor failures, per-case failures,
      detection misses, regressions).

      ## Scorecard
      $aggregate.output
    output_format:
      type: object
      properties:
        gate:
          type: string
          enum: [PASS, FAIL]
        overall: { type: number }
        blocking:
          type: array
          items: { type: string }
        summary: { type: string }
      required: [gate, summary]
